name: Release

# Déclenché à chaque tag v* (ex: v1.0.0) et manuellement via l'onglet Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Crée (ou réutilise) la release GitHub qui recevra les artefacts des 3 OS.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4

      # tauri-action lance aussi `npm run tauri build` dans ce job : il lui faut l'environnement complet.
      - name: Dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf build-essential curl wget file libssl-dev

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Créer la release
        id: create-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CableScope ${{ github.ref_name }}'
          releaseBody: |
            ## CableScope — release ${{ github.ref_name }}

            - **Windows** : `.exe` (installeur NSIS) + `.msi` — testé (installation/désinstallation silencieuses validées en CI)
            - **macOS** : `.dmg` / `.app` — **non testé** (scan USB = API Win32)
            - **Linux** : `.deb` / `.AppImage` — **non testé** (scan USB = API Win32)

            > Sur macOS/Linux, l'app se lance mais le scan retournera un état vide :
            > le scan USB repose sur SetupAPI/cfgmgr32/DeviceIoControl (Windows uniquement).
          releaseDraft: true
          prerelease: false

  # Build la v1.0.0 sur les 3 plateformes et attache les artefacts à la release.
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Dépendances système Linux (WebKitGTK 4.1 pour Tauri v2)
      - name: Dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf build-essential curl wget file libssl-dev

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Builder et uploader CableScope
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
      - name: Tester l'installation silencieuse (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "Installeur NSIS introuvable" }

          # 1) Installation silencieuse (NSIS /S)
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 6

          # 2) Localiser l'exe installe : chemin par defaut, registre, puis recherche
          $exe = "$env:LOCALAPPDATA\CableScope\cablescope.exe"
          if (-not (Test-Path $exe)) {
            $reg = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CableScope' -ErrorAction SilentlyContinue
            if ($reg -and $reg.InstallLocation) {
              $cand = Join-Path $reg.InstallLocation 'cablescope.exe'
              if (Test-Path $cand) { $exe = $cand }
            }
          }
          if (-not (Test-Path $exe)) {
            $found = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter 'cablescope.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notlike '*\target\*' } | Select-Object -First 1
            if ($found) { $exe = $found.FullName }
          }
          if (-not (Test-Path $exe)) { throw "cablescope.exe introuvable apres installation" }
          Write-Host "OK installe : $exe"

          # 3) Lancement de controle : l'app doit rester en vie ~8s
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "L'app a quitte prematurement (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "OK : l'application se lance"

          # 4) Desinstallation silencieuse puis verification de la suppression
          $un = Join-Path (Split-Path $exe) 'uninstall.exe'
          if (-not (Test-Path $un)) {
            $reg = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CableScope' -ErrorAction SilentlyContinue
            if ($reg -and $reg.UninstallString) {
              $cand = ($reg.UninstallString -replace '"', '').Trim()
              if (Test-Path $cand) { $un = $cand }
            }
          }
          if (Test-Path $un) {
            Start-Process -FilePath $un -ArgumentList '/S' -Wait
            Start-Sleep -Seconds 6
          } else {
            throw "uninstall.exe introuvable, desinstallation non verifiee"
          }
          if (Test-Path $exe) { throw "cablescope.exe existe encore apres desinstallation" }
          Write-Host "OK : desinstallation silencieuse validee"
