<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B8D4"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark circle background -->
  <circle cx="256" cy="256" r="250" fill="#0D1117" stroke="url(#g1)" stroke-width="4"/>
  <!-- USB-C connector outline (simplified top-down view) -->
  <g filter="url(#glow)" transform="translate(256,256)">
    <!-- Cable body -->
    <rect x="-40" y="-160" width="80" height="120" rx="10" fill="url(#g2)" opacity="0.3"/>
    <!-- Connector housing -->
    <rect x="-32" y="-50" width="64" height="100" rx="16" fill="#1A2332" stroke="url(#g1)" stroke-width="3"/>
    <!-- Inner connector (USB-C port shape) -->
    <rect x="-18" y="-34" width="36" height="68" rx="8" fill="none" stroke="url(#g1)" stroke-width="2.5"/>
    <!-- USB-C pin contacts (2 rows of 6) -->
    <rect x="-14" y="-26" width="6" height="3" rx="1" fill="#00E5FF" opacity="0.9"/>
    <rect x="-4" y="-26" width="6" height="3" rx="1" fill="#00C853" opacity="0.9"/>
    <rect x="8"  y="-26" width="6" height="3" rx="1" fill="#00E5FF" opacity="0.9"/>
    <rect x="-14" y="-18" width="6" height="3" rx="1" fill="#00C853" opacity="0.9"/>
    <rect x="-4"  y="-18" width="6" height="3" rx="1" fill="#00E5FF" opacity="0.9"/>
    <rect x="8"   y="-18" width="6" height="3" rx="1" fill="#00C853" opacity="0.9"/>
    <!-- Bottom pin contacts -->
    <rect x="-14" y="14" width="6" height="3" rx="1" fill="#00E5FF" opacity="0.9"/>
    <rect x="-4"  y="14" width="6" height="3" rx="1" fill="#00C853" opacity="0.9"/>
    <rect x="8"   y="14" width="6" height="3" rx="1" fill="#00E5FF" opacity="0.9"/>
    <rect x="-14" y="22" width="6" height="3" rx="1" fill="#00C853" opacity="0.9"/>
    <rect x="-4"  y="22" width="6" height="3" rx="1" fill="#00E5FF" opacity="0.9"/>
    <rect x="8"   y="22" width="6" height="3" rx="1" fill="#00C853" opacity="0.9"/>
    <!-- Center lightning bolt (power/data indicator) -->
    <path d="M4,-8 L-4,2 L1,2 L-4,10 L4,0 L-1,0 Z" fill="#FFFFFF" opacity="0.95"/>
  </g>
  <!-- Subtle ring around connector -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.3"/>
</svg>
